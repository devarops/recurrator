services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: evaristor/recurrator:latest
    command: uvicorn recurrator.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - $PWD:/workdir
      - ~/.config/recurrator:/root/.config/recurrator

  cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: evaristor/recurrator:latest
    command: bash
    volumes:
      - $PWD:/workdir
      - ~/.config/recurrator:/root/.config/recurrator
    depends_on:
      - api
