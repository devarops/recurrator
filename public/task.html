<!DOCTYPE html>
<html>
<head>
    <title>Task Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>
<body>
    <h1>Task Details</h1>
    <div id="task">Loading...</div>
    <div id="error" style="color: red;"></div>

    <script src="main.js"></script>
    <script>
        const apiBaseUrl = 'http://localhost:8000';
        const taskElement = document.getElementById('task');
        const errorElement = document.getElementById('error');
        const taskId = new URL(window.location).searchParams.get('id');
        const csvParam = new URL(window.location).searchParams.get('csv');
        const apiUrl = csvParam 
            ? `${apiBaseUrl}/task/${taskId}?csv=${encodeURIComponent(csvParam)}`
            : `${apiBaseUrl}/task/${taskId}`;

        fetch(apiUrl)
            .then(r => r.json())
            .then(task => {
                taskElement.innerHTML = renderTask(task);
            })
            .catch(err => {
                errorElement.innerHTML = `Error: ${err.message}`;
            });
    </script>
</body>
</html>
