<!DOCTYPE html>
<html>
<head>
    <title>Task Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>
<body>
    <h1>Task Details</h1>
    <div id="task">Loading...</div>
    <div id="error" style="color: red;"></div>

    <script>
        const apiBaseUrl = 'http://localhost:8000';
        const taskId = new URL(window.location).searchParams.get('id') || '8';
        const csvParam = new URL(window.location).searchParams.get('csv');
        const apiUrl = csvParam 
            ? `${apiBaseUrl}/task/${taskId}?csv=${encodeURIComponent(csvParam)}`
            : `${apiBaseUrl}/task/${taskId}`;

        fetch(apiUrl)
            .then(r => r.json())
            .then(task => {
                document.getElementById('task').innerHTML = `
                    <table>
                        <tbody>
                            <tr><td>ID</td><td>${task.id}</td></tr>
                            <tr><td>Description</td><td>${task.description}</td></tr>
                            <tr><td>Context</td><td>${task.context}</td></tr>
                            <tr><td>Skip Count</td><td>${task.skip_count}</td></tr>
                            <tr><td>Starred</td><td>${task.starred ? 'Yes' : 'No'}</td></tr>
                            <tr><td>Latest Date</td><td>${task.latest_date}</td></tr>
                            <tr><td>Recurrence</td><td>${task.recurrence_days} days</td></tr>
                            <tr><td>Due Date</td><td>${task.due_date}</td></tr>
                        </tbody>
                    </table>
                `;
            })
            .catch(err => {
                document.getElementById('error').innerHTML = `Error: ${err.message}`;
            });
    </script>
</body>
</html>
