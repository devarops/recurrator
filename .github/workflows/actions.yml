name: CI/CD Pipeline
on:
  push:
    branches:
      - develop
jobs:
  build-image:
    name: Test in develop, publish prod
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@main

    - name: Build the production image
      run: docker compose build api

    - name: Build the development image
      run: docker compose --profile develop build develop

    - name: Start the develop container
      run: docker compose --profile develop run --name recurrator_dev --rm --detach develop sleep infinity

    - name: Wait for the API
      run: |
        for attempt in $(seq 30); do
          if curl --fail --silent http://127.0.0.1/openapi.json > /dev/null; then
            exit 0
          fi
          sleep 2
        done
        curl --fail --show-error http://127.0.0.1/openapi.json

    - name: Run checks and tests
      run: |
        docker compose --profile develop exec -T develop make setup
        docker compose --profile develop exec -T develop make check
        docker compose --profile develop exec -T develop make tests
        docker compose --profile develop exec -T develop make test-frontend
        docker compose --profile develop exec -T develop make coverage

    # Before mutants, because `make mutants` depends on `setup`, whose `clean`
    # deletes coverage.xml.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@main
      with:
        files: ./coverage.xml
        verbose: true

    - name: Run mutation tests
      run: docker compose --profile develop exec -T develop make mutants

    - name: Verify acceptance criteria
      run: bash .pipelines/verify.sh

    # The prod image carries no test tooling, so boot it alone with no volumes:
    # a dependency that only exists in the develop image fails here and nowhere
    # else.
    - name: Smoke-test the production image
      run: |
        docker run --detach --name recurrator_smoke --publish 18000:8000 \
          evaristor/recurrator:latest \
          uvicorn recurrator.api:app --host 0.0.0.0 --port 8000
        for attempt in $(seq 30); do
          if curl --fail --silent http://127.0.0.1:18000/openapi.json > /dev/null; then
            break
          fi
          sleep 2
        done
        curl --fail --show-error http://127.0.0.1:18000/openapi.json | grep --quiet 'FastAPI'
        curl --fail --show-error http://127.0.0.1:18000/ | grep --quiet '<div id="scopes"'
        curl --fail --show-error http://127.0.0.1:18000/ui.js | grep --quiet 'renderMonsterCard'
        docker rm --force recurrator_smoke

    - name: Docker log-in
      env:
        docker_username: ${{ secrets.docker_username }}
        docker_password: ${{ secrets.docker_password }}
      run: echo "${docker_password}" | docker login -u "${docker_username}" --password-stdin

    - name: Push the production image
      run: |
        four_digit_tag=$(date +%y%V)
        docker tag evaristor/recurrator:latest evaristor/recurrator:${four_digit_tag}
        docker push evaristor/recurrator:latest
        docker push evaristor/recurrator:${four_digit_tag}
