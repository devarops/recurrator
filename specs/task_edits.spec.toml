#:schema https://raw.githubusercontent.com/tskovlund/qed/main/docs/spec.schema.json

name = "task_edits"

# Every criterion is a scenario a user can observe through the HTTP API.
# Each one stays skipped until its test in tests/test_acceptance_task_edits.py exists.

[[criteria]]
description = """
When a task is starred, the response returns its ID and the new flag, and a
later read reports the task as starred.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_starred_task_is_reported"

[[criteria]]
description = """
When the same starred value is written twice, both writes return 200 with the
same confirmation subset.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_starring_is_idempotent"

[[criteria]]
description = """
When no task has the given ID, the starred write returns 404 with an error
field in the body.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_star_unknown_task_returns_404"

[[criteria]]
description = """
When the body omits the starred flag or sends a non-boolean, the write returns
422 with an error field in the body, and a later read reports the previous
value.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_malformed_starred_body_is_rejected"

[[criteria]]
description = """
When a description is written, the response returns its ID and the new text,
and a later read reports the text unchanged, markdown included.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_description_is_written_verbatim"

[[criteria]]
description = """
When the description is empty or only whitespace, the write returns 400 with an
error field in the body, and a later read reports the previous text.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_empty_description_is_rejected"

[[criteria]]
description = """
When no task has the given ID, the description write returns 404 with an error
field in the body.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_description_unknown_task_returns_404"

[[criteria]]
description = """
When the body omits the description or sends a non-string, the write returns
422 with an error field in the body, and a later read reports the previous
text.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_malformed_description_body_is_rejected"

[[criteria]]
description = """
When the description has non-whitespace text with leading or trailing
whitespace, the response returns that exact text, and a later read
reports it unchanged.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_description_whitespace_is_preserved"

[[criteria]]
description = """
When the description contains the two characters backslash and n, the response
returns those exact characters, and a later read reports them unchanged.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_backslash_and_n_are_ordinary_text"

[[criteria]]
description = """
When no task has the given ID and the description is empty or only
whitespace, the write returns 404 with an error field in the body.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_unknown_task_takes_precedence_over_an_empty_description"

[[criteria]]
description = """
When contexts are written, the response returns the task ID and the new
contexts, sorted alphabetically and deduplicated, and a later read reports the
same contexts.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_contexts_are_written"

[[criteria]]
description = """
When contexts names a stored context that no task uses, the write succeeds,
because the context data is authoritative.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_contexts_write_accepts_an_unused_context"

[[criteria]]
description = """
When the same contexts are written twice, both writes return 200 with the same
confirmation subset.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_context_write_is_idempotent"

[[criteria]]
description = """
When no task has the given ID, the contexts write returns 404 with an error
field in the body.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_contexts_unknown_task_returns_404"

[[criteria]]
description = """
When contexts is missing, is not an array, contains a non-string, is empty,
repeats a context, or names no stored context, the write returns 422 with an
error field in the body, and a later read reports the previous contexts.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_invalid_contexts_are_rejected"

[[criteria]]
description = """
When the body omits contexts or sends a non-array, the write returns 422 even
when no task has the given ID.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_malformed_contexts_body_takes_precedence_over_an_unknown_task"

[[criteria]]
description = """
When no task has the given ID and the contexts list is empty, the write returns
404 with an error field in the body.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_edits.py::test_unknown_task_takes_precedence_over_an_empty_context_list"
