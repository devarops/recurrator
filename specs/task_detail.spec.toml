#:schema https://raw.githubusercontent.com/tskovlund/qed/main/docs/spec.schema.json

name = "task_detail"

# Every criterion is a scenario a user can observe through the HTTP API.
# Each one stays skipped until its test in tests/test_acceptance_task_detail.py exists.

[[criteria]]
description = """
When a task is read, latest_done_date equals the fourth stored completion date.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_detail.py::test_detail_reports_last_completion"

[[criteria]]
description = """
When a later skip date moves latest_date forward, latest_done_date still equals
the last completion date.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_detail.py::test_last_completion_ignores_the_skip_date"

[[criteria]]
description = """
When a task is completed, the response includes the new latest_done_date, equal
to the completion date.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_task_detail.py::test_completion_returns_last_completion"
