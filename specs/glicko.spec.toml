#:schema https://raw.githubusercontent.com/tskovlund/qed/main/docs/spec.schema.json

name = "glicko"

# Every criterion is a scenario a user can observe through the HTTP API.
# Each one stays skipped until its test in tests/test_acceptance_glicko.py exists.

[[criteria]]
description = """
When a task is read or completed, rating and rating deviation are integers.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_integer_contract"

[[criteria]]
description = """
When four tasks are due in one context and one is completed, the completed
task loses rating, the other three change, and every other task keeps its
rating.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_four_tasks"

[[criteria]]
description = """
When four tasks are due and a fifth task that is not yet due is completed, all
five take part in the event and all five ratings change.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_early_completion"

[[criteria]]
description = """
When the context page holds a single due task, completing it changes its
rating and no synthetic task appears in the task list.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_solo_completion"

[[criteria]]
description = """
When two participants play, the stored results match a simultaneous update
rather than a sequential one.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_simultaneous_update"

[[criteria]]
description = """
When a task is completed in one context, tasks in another context keep their
ratings.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_context_isolation"

[[criteria]]
description = """
When two otherwise identical tasks have last updates a year apart, reading
both at the same reference date shows the older task with the larger rating
deviation, and both stay within 45 and 500.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_inactivity_growth"
