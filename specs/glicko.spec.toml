#:schema https://raw.githubusercontent.com/tskovlund/qed/main/docs/spec.schema.json

name = "glicko"

# Every criterion is a scenario a user can observe through the HTTP API.
# Each one stays skipped until its test in tests/test_acceptance_glicko.py exists.

[[criteria]]
description = """
When a task is read or completed, rating and rating deviation are integers.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_integer_contract"

[[criteria]]
description = """
When four tasks are due in one context and one is completed, the completed
task loses rating, the other three change, a task in the same context that is
not yet due keeps its rating, and a task that shares no context with the
completed task keeps its too.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_four_tasks"

[[criteria]]
description = """
When four tasks are due and a fifth task that is not yet due is completed, all
five take part in the event and all five ratings change.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_early_completion"

[[criteria]]
description = """
When a context holds a single due task, completing it changes its rating.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_solo_completion"

[[criteria]]
description = """
When two participants play, the stored results match a simultaneous update
rather than a sequential one.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_simultaneous_update"

[[criteria]]
description = """
When a task is completed in one context, a task that shares no context with it
keeps its rating.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_context_isolation"

[[criteria]]
description = """
When a completed task belongs to two contexts, every due task that shares at
least one of those contexts takes part in one event, and a task that shares both
contexts participates once.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_shared_context_event"

[[criteria]]
description = """
When a completed task belongs to two contexts and a due task shares only the
second context, that task's rating changes.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_second_context_participates"

[[criteria]]
description = """
When a completed task belongs to two contexts and two due tasks share no context
with it, both keep their ratings.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_shared_context_isolation"

[[criteria]]
description = """
When two otherwise identical tasks have last updates a year apart, reading
both at the same reference date shows the older task with the larger rating
deviation, and both stay within 45 and 500.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_inactivity_growth"

[[criteria]]
description = """
When a task anchored at rating deviation 350 is read one year after its rating
date, its rating deviation is 362.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_deviation_growth"

[[criteria]]
description = """
When a task is read without a date, its rating deviation equals the value
returned when the same task is read with today as the date.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_default_date_projection"

[[criteria]]
description = """
When a task is completed, reading it without a date returns the same rating
deviation as the completion response.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_glicko.py::test_glicko_completion_anchor"
