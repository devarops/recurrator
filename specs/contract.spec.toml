#:schema https://raw.githubusercontent.com/tskovlund/qed/main/docs/spec.schema.json

name = "contract"

# Every criterion is a scenario a user can observe through the HTTP API.
# Each one stays skipped until its test in tests/test_acceptance_contract.py exists.

[[criteria]]
description = """
When the OpenAPI document is read, no 200 response has an empty schema. An
object response declares properties, and an array response declares an item
schema.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_contract.py::test_openapi_declares_response_properties"

[[criteria]]
description = """
When the task detail schema is read, contexts is declared as an array whose
items are strings.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_contract.py::test_openapi_declares_task_contexts"

[[criteria]]
description = """
When the context detail schema is read, it declares id, display_name,
description, and scopes, and scopes is an array whose items are strings.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_contract.py::test_openapi_declares_context_properties"

[[criteria]]
description = """
When the context collection and its due variants are described, each declares
an array of strings, and the task collection and its due variants declare an
array of integers.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_contract.py::test_openapi_declares_collection_items"
