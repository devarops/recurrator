#:schema https://raw.githubusercontent.com/tskovlund/qed/main/docs/spec.schema.json

name = "context_views"

# Every criterion is a scenario a user can observe through the HTTP API.
# Each one stays skipped until its test in tests/test_acceptance_context_views.py exists.

[[criteria]]
description = """
When the context data holds several contexts, a read of the context collection
returns every context ID from the context data, sorted alphabetically, including
a context that no task names.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_context_views.py::test_all_contexts_are_listed"

[[criteria]]
description = """
When a request points contexts_csv at a different context file, the context
collection returns that file's context IDs rather than the configured file's.
"""
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_context_views.py::test_contexts_csv_selects_the_context_file"

[[criteria]]
description = """
When a context has at least one task due on or before the reference date, a
dated due read of the context collection includes it, and excludes every
context with no due task.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_context_views.py::test_due_contexts_are_listed_for_a_date"

[[criteria]]
description = """
When the due read carries no date, it returns the same contexts as the due read
for today's date in America/Los_Angeles.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_context_views.py::test_undated_due_read_uses_today"

[[criteria]]
description = """
When the due read omits the trailing slash, the response redirects to the due
collection with the trailing slash and does not list context names.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_context_views.py::test_due_read_without_trailing_slash_redirects"

[[criteria]]
description = """
When one context is read through its detail route, the response carries its
ID, display name, description, and every scope it names, with the scopes sorted
alphabetically and deduplicated.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_context_views.py::test_context_detail_reports_its_fields"

[[criteria]]
description = """
When a context has no tasks, its detail route still returns the context and
its scopes, because the context data is authoritative.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_context_views.py::test_context_detail_lists_an_unused_context"

[[criteria]]
description = """
When the context is absent from the context data, the detail route returns 404
with an error message.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_context_views.py::test_unknown_context_returns_404"

[[criteria]]
description = """
When the detail route omits the trailing slash, the response redirects with 307
to the detail route with the trailing slash and does not return the context
object.
"""
skip = "Not implemented"
[criteria.verify]
type = "command"
run = "pytest tests/test_acceptance_context_views.py::test_context_detail_without_trailing_slash_redirects"
